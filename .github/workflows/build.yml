name: Build NLK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11'

      - name: Build
        run: gradle build --no-daemon

      - name: Validate resource pack
        run: |
          test -f src/main/resources/resourcepack/pack.mcmeta
          test -f src/main/resources/resourcepack/assets/minecraft/models/item/sandstone.json
          test -f src/main/resources/resourcepack/assets/minecraft/models/item/end_stone.json
          test -f src/main/resources/resourcepack/assets/minecraft/textures/item/nlk_sulfur.png
          test -f src/main/resources/resourcepack/assets/minecraft/textures/item/nlk_potent_sulfur.png

      - name: Build Java resource pack
        run: |
          mkdir -p build/resourcepack
          cp -R src/main/resources/resourcepack/. build/resourcepack/
          cd build/resourcepack
          zip -r ../NLK-Future-Items.zip .

      - name: Upload Resource Pack
        uses: actions/upload-artifact@v4
        with:
          name: NLK-Future-Items-ResourcePack
          path: build/NLK-Future-Items.zip

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: NLK-Compatibility
          path: build/libs/*.jar
